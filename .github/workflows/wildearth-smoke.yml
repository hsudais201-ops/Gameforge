name: WILDEARTH smoke tests

on:
  push:
    branches: [feature/wildearth-browser-prototype]
  pull_request:
    branches: [feature/wildearth-browser-prototype]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run startup and save compatibility smoke tests
        run: node --test tests/wildearth-smoke.test.mjs
