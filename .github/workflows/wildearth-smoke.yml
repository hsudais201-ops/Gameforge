name: WILDEARTH smoke tests

on:
  push:
    branches: [feature/wildearth-browser-prototype]
  pull_request:
    branches: [feature/wildearth-browser-prototype]

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pinned development dependencies
        run: npm install --no-audit --no-fund
      - name: Install headless Chromium
        run: npx playwright install chromium
      - name: Run syntax, source, and browser gameplay checks
        run: npm run check
